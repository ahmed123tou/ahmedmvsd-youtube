<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ahmed MVSD — Live Stats</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="card">

            <img
                id="avatar"
                class="avatar"
                src=""
                alt="Ahmed MVSD"
            >

            <h1 id="channelName">Ahmed MVSD</h1>

            <p id="channelHandle">@ahmedmvsd</p>

            <div class="stats">

                <div class="stat">
                    <div class="stat-title">Subscribers</div>
                    <div id="subscribers" class="stat-number">
                        Loading...
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-title">Views</div>
                    <div id="views" class="stat-number">
                        Loading...
                    </div>
                </div>

                <div class="stat">
                    <div class="stat-title">Videos</div>
                    <div id="videos" class="stat-number">
                        Loading...
                    </div>
                </div>

            </div>

            <div class="live">
                <span class="live-dot"></span>
                LIVE STATS
            </div>

            <div id="updated" class="updated">
                Loading...
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
